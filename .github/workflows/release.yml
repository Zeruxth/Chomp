# Builds Chomp.app for Apple Silicon and Intel.
# - Push a tag like v0.3.0 → publishes a GitHub Release with Chomp.zip.
# - Run it by hand (Actions → Release → Run workflow) → test build only, downloadable from the run page.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build Chomp.app
        env:
          UNIVERSAL: "1"
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION="0.0.0-test"
          fi
          ./build.sh

      - name: Zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/Chomp.app Chomp.zip
          shasum -a 256 Chomp.zip | tee Chomp.zip.sha256
          ls -lh Chomp.zip

      - name: Keep the build on the run page
        uses: actions/upload-artifact@v4
        with:
          name: Chomp
          path: |
            Chomp.zip
            Chomp.zip.sha256

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Chomp.zip Chomp.zip.sha256 \
            --title "Chomp $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes
