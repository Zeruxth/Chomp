# Builds Chomp for Windows and runs real conversions through it on every change to windows/.
name: Windows

on:
  push:
    paths: ["windows/**", "Resources/Fonts/**", "Resources/Localization/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "Resources/Fonts/**", "Resources/Localization/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet publish windows/Chomp -c Release -o out

      - name: Bundle ffmpeg
        shell: pwsh
        run: windows/fetch-ffmpeg.ps1 out

      - name: Bundle the cut-out model
        shell: pwsh
        run: windows/fetch-model.ps1 out

      - name: Smoke test
        shell: pwsh
        run: windows/smoke-test.ps1 out/Chomp.exe

      - name: Keep the build on the run page
        uses: actions/upload-artifact@v4
        with:
          name: Chomp-Windows
          path: out/
